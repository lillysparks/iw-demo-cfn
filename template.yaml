AWSTemplateFormatVersion: '2010-09-09'
Description: Apollo GraphQL API with Aurora Postgres + PostGIS

Resources:

  # --- VPC ---
  GraphQLVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: GraphQLVPC

  InternetGateway:
    Type: AWS::EC2::InternetGateway

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref GraphQLVPC
      InternetGatewayId: !Ref InternetGateway

  # --- Public Subnet (Lambda goes here for demo to avoid NAT Gateway cost) ---
  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref GraphQLVPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [ 0, !GetAZs '' ]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: PublicSubnetA

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref GraphQLVPC

  PublicRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable

  # --- Private Subnets (Aurora goes here, best practice) ---
  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref GraphQLVPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [ 0, !GetAZs '' ]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: PrivateSubnetA

  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref GraphQLVPC
      CidrBlock: 10.0.3.0/24
      AvailabilityZone: !Select [ 1, !GetAZs '' ]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: PrivateSubnetB

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref GraphQLVPC
      Tags:
        - Key: Name
          Value: PrivateRT

  PrivateSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetA
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetB
      RouteTableId: !Ref PrivateRouteTable

  # --- Aurora DB Subnet Group (Aurora requires at least two AZs) ---
  AuroraSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Aurora private subnets
      SubnetIds:
        - !Ref PrivateSubnetA
        - !Ref PrivateSubnetB
      DBSubnetGroupName: GraphQLAuroraSubnetGroup

  # --- Security Groups ---
  AuroraSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow Lambda access to Aurora
      VpcId: !Ref GraphQLVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref LambdaSecurityGroup

  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Lambda SG
      VpcId: !Ref GraphQLVPC
      # Outbound is allowed by default

  # --- Cognito User Pool ---
  GraphQLUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: GraphQLUserPool
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false

  GraphQLUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: GraphQLAppClient
      UserPoolId: !Ref GraphQLUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_SRP_AUTH

  GraphQLUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub "${AWS::StackName}-graphql"
      UserPoolId: !Ref GraphQLUserPool

  AuroraCluster:
    Type: AWS::RDS::DBCluster
    Properties:
      Engine: aurora-postgresql
      EngineVersion: "14.6"
      DBClusterIdentifier: aurora-postgis-cluster
      MasterUsername: postgresadmin
      MasterUserPassword: MySecurePassword123   # ⚠️ Replace with Secrets Manager in production
      BackupRetentionPeriod: 1
      DBSubnetGroupName: !Ref AuroraSubnetGroup
      VpcSecurityGroupIds:
        - !Ref AuroraSecurityGroup

  # --- Lambda Role ---
  GraphQLLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
        - arn:aws:iam::aws:policy/service-role/AWSLambdaRole

  # --- Lambda Function (in public subnet for demo) ---
  GraphQLLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: GraphQLApiLambda
      Runtime: nodejs18.x
      Handler: index.graphqlHandler
      Role: !GetAtt GraphQLLambdaRole.Arn
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
        SubnetIds:
          - !Ref PublicSubnetA   # Lambda in public subnet for demo (avoids NAT cost)
      Environment:
        Variables:
          DB_HOST: !GetAtt AuroraCluster.Endpoint.Address
          DB_PORT: "5432"
          DB_NAME: "postgres"
          DB_USER: "postgresadmin"
          DB_PASSWORD: "MySecurePassword123"
          COGNITO_USERPOOL_ID: !Ref GraphQLUserPool
          COGNITO_CLIENT_ID: !Ref GraphQLUserPoolClient
          COGNITO_ISSUER: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${GraphQLUserPool}"
      Code:
        ZipFile: |
          const { ApolloServer } = require('@apollo/server');
          const { startServerAndCreateLambdaHandler } = require('@as-integrations/aws-lambda');
          const jwt = require('jsonwebtoken');
          const jwksClient = require('jwks-rsa');
          const { Pool } = require('pg');

          const pool = new Pool({
            host: process.env.DB_HOST,
            port: process.env.DB_PORT,
            user: process.env.DB_USER,
            password: process.env.DB_PASSWORD,
            database: process.env.DB_NAME
          });

          const client = jwksClient({
            jwksUri: `${process.env.COGNITO_ISSUER}/.well-known/jwks.json`
          });

          function getKey(header, callback) {
            client.getSigningKey(header.kid, (err, key) => {
              const signingKey = key.getPublicKey();
              callback(null, signingKey);
            });
          }

          async function verifyToken(authHeader) {
            const token = authHeader?.startsWith("Bearer ") ? authHeader.slice(7) : null;
            if (!token) return null;
            return new Promise((resolve) =>
              jwt.verify(token, getKey, {
                algorithms: ['RS256'],
                audience: process.env.COGNITO_CLIENT_ID,
                issuer: process.env.COGNITO_ISSUER
              }, (err, decoded) => resolve(err ? null : decoded))
            );
          }

          const typeDefs = `type Query { hello: String }`;
          const resolvers = {
            Query: {
              hello: (_, __, ctx) => `Hello ${ctx.user?.email || "guest"} from Aurora + Cognito!`
            }
          };

          const server = new ApolloServer({ typeDefs, resolvers });
          exports.graphqlHandler = startServerAndCreateLambdaHandler(server, {
            context: async ({ event }) => {
              const user = await verifyToken(event.headers?.authorization);
              return { user };
            }
          });

  # --- API Gateway ---
  GraphQLApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: GraphQLApi
      ProtocolType: HTTP

  GraphQLIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref GraphQLApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${GraphQLLambda.Arn}/invocations
      PayloadFormatVersion: "2.0"

  GraphQLRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref GraphQLApi
      RouteKey: "POST /graphql"
      Target: !Join [ "/", [ "integrations", !Ref GraphQLIntegration ] ]

  GraphQLStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref GraphQLApi
      StageName: dev
      AutoDeploy: true

  GraphQLPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref GraphQLLambda
      Principal: apigateway.amazonaws.com


Outputs:

  GraphQLApiEndpoint:
    Description: Public URL for the GraphQL API
    Value: !Sub "https://${GraphQLApi}.execute-api.${AWS::Region}.amazonaws.com/dev/graphql"

  CognitoUserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref GraphQLUserPool

  CognitoAppClientId:
    Description: Cognito App Client ID
    Value: !Ref GraphQLUserPoolClient

  AuroraClusterEndpoint:
    Description: Aurora Cluster Endpoint
    Value: !GetAtt AuroraCluster.Endpoint.Address

