version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 18
    commands:
      - npm install -g aws-sam-cli
  pre_build:
    commands:
      - cd lambda
      - npm install
      - npm run build
      - cd ..
  build:
    commands:
      - sam build
      - sam deploy --no-confirm-changeset --no-fail-on-empty-changeset \
          --stack-name graphql-demo \
          --capabilities CAPABILITY_IAM \
          --region us-east-1
