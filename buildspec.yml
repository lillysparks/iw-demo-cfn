version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 18
      python: 3.11
    commands:
      - pip install --upgrade pip
      - pip install aws-sam-cli
  pre_build:
    commands:
      - echo "Install & build lambda"
      - cd lambda
      - npm ci
      - npm run build
      - cd ..
      - echo "Downloading seed data"
      - mkdir -p lambda/seed-data
      - curl -o lambda/seed-data/countries.sql https://raw.githubusercontent.com/adityatoshniwal/postgis-sample-dataset/main/countries.sql
  build:
    commands:
      - echo "Copying seed-data to lambda for packaging"
      - cp -r lambda/seed-data .aws-sam/build/GraphQLLambda/ || true
      - echo "Building Lambda with SAM"
      - sam build --template application/lambda.yaml
      - echo "Ensuring seed-data is in the build"
      - mkdir -p .aws-sam/build/GraphQLLambda/seed-data
      - cp lambda/seed-data/countries.sql .aws-sam/build/GraphQLLambda/seed-data/ || echo "Warning: seed data not found"
      - echo "Packaging Lambda stack"
      - sam package --template .aws-sam/build/template.yaml --s3-bucket iw-demo-cfn-artifacts-us-east-1 --output-template-file .aws-sam/lambda-packaged.yaml
      - echo "Uploading nested stack templates to S3"
      - aws s3 cp infrastructure/ s3://iw-demo-cfn-artifacts-us-east-1/infrastructure/ --recursive --exclude "*" --include "*.yaml"
      - aws s3 cp .aws-sam/lambda-packaged.yaml s3://iw-demo-cfn-artifacts-us-east-1/application/lambda.yaml
      - aws s3 cp application/api.yaml s3://iw-demo-cfn-artifacts-us-east-1/application/api.yaml
      - aws s3 cp auth/ s3://iw-demo-cfn-artifacts-us-east-1/auth/ --recursive --exclude "*" --include "*.yaml"
      - aws s3 cp pipeline/ s3://iw-demo-cfn-artifacts-us-east-1/pipeline/ --recursive --exclude "*" --include "*.yaml"
      - echo "Copying main template as packaged output"
      - cp template.yaml packaged.yaml
artifacts:
  files:
    - packaged.yaml