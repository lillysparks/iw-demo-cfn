version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 18
      python: 3.11
    commands:
      - pip install --upgrade pip
      - pip install aws-sam-cli
  pre_build:
    commands:
      - echo "Install & build lambda"
      - cd lambda
      - npm ci
      - npm run build
      - cd ..
  build:
    commands:
      - echo "Running sam build"
      - sam build
      - echo "Packaging to S3 bucket configured in samconfig.toml"
      - sam package --s3-bucket iw-demo-cfn-artifacts-us-east-1 --output-template-file packaged.yaml
artifacts:
  files:
    - packaged.yaml