AWSTemplateFormatVersion: '2010-09-09'
Description: Apollo GraphQL API with Aurora Postgres + PostGIS - Main Stack
Transform: AWS::Serverless-2016-10-31

Parameters:
  PipelineBucketName:
    Type: String
    Description: S3 bucket name for SAM/CodePipeline artifacts
  AuroraSecretArn:
    Type: String
    Description: ARN of an existing Secrets Manager secret containing DB credentials

Resources:
  # --- Infrastructure Layer ---
  NetworkStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub "https://s3.amazonaws.com/${PipelineBucketName}/infrastructure/network.yaml"
      TimeoutInMinutes: 30

  SecurityStack:
    Type: AWS::CloudFormation::Stack
    DependsOn: NetworkStack
    Properties:
      TemplateURL: !Sub "https://s3.amazonaws.com/${PipelineBucketName}/infrastructure/security.yaml"
      Parameters:
        VPCId: !GetAtt NetworkStack.Outputs.VPCId
      TimeoutInMinutes: 10

  DatabaseStack:
    Type: AWS::CloudFormation::Stack
    DependsOn:
      - NetworkStack
      - SecurityStack
    Properties:
      TemplateURL: !Sub "https://s3.amazonaws.com/${PipelineBucketName}/infrastructure/database.yaml"
      Parameters:
        PrivateSubnetAId: !GetAtt NetworkStack.Outputs.PrivateSubnetAId
        PrivateSubnetBId: !GetAtt NetworkStack.Outputs.PrivateSubnetBId
        AuroraSecurityGroupId: !GetAtt SecurityStack.Outputs.AuroraSecurityGroupId
        AuroraSecretArn: !Ref AuroraSecretArn
      TimeoutInMinutes: 30

  # --- Authentication Layer ---
  AuthStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub "https://s3.amazonaws.com/${PipelineBucketName}/auth/cognito.yaml"
      Parameters:
        StackName: !Ref AWS::StackName
      TimeoutInMinutes: 10

  # --- Application Layer ---
  LambdaStack:
    Type: AWS::CloudFormation::Stack
    DependsOn:
      - NetworkStack
      - SecurityStack
      - DatabaseStack
      - AuthStack
    Properties:
      TemplateURL: !Sub "https://s3.amazonaws.com/${PipelineBucketName}/application/lambda.yaml"
      Parameters:
        PrivateSubnetAId: !GetAtt NetworkStack.Outputs.PrivateSubnetAId
        PrivateSubnetBId: !GetAtt NetworkStack.Outputs.PrivateSubnetBId
        LambdaSecurityGroupId: !GetAtt SecurityStack.Outputs.LambdaSecurityGroupId
        DBHost: !GetAtt DatabaseStack.Outputs.AuroraInstanceEndpoint
        DBPort: !GetAtt DatabaseStack.Outputs.AuroraInstancePort
        AuroraSecretArn: !Ref AuroraSecretArn
        CognitoUserPoolId: !GetAtt AuthStack.Outputs.UserPoolId
        CognitoClientId: !GetAtt AuthStack.Outputs.UserPoolClientId
        CognitoIssuer: !GetAtt AuthStack.Outputs.UserPoolIssuer
      TimeoutInMinutes: 10

  ApiStack:
    Type: AWS::CloudFormation::Stack
    DependsOn: LambdaStack
    Properties:
      TemplateURL: !Sub "https://s3.amazonaws.com/${PipelineBucketName}/application/api.yaml"
      Parameters:
        LambdaArn: !GetAtt LambdaStack.Outputs.LambdaArn
        LambdaName: !GetAtt LambdaStack.Outputs.LambdaName
      TimeoutInMinutes: 10

  # --- CI/CD Layer ---
  PipelineStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub "https://s3.amazonaws.com/${PipelineBucketName}/pipeline/cicd.yaml"
      Parameters:
        PipelineBucketName: !Ref PipelineBucketName
        GitHubConnectionArn: arn:aws:codeconnections:us-east-1:920671455518:connection/3d4db5bf-d87c-47bb-83d8-3faf92ba204e
        GitHubRepository: lillysparks/iw-demo-cfn
        GitHubBranch: main
        MainStackName: !Ref AWS::StackName
        AuroraSecretArn: !Ref AuroraSecretArn
      TimeoutInMinutes: 10

Outputs:
  GraphQLApiEndpoint:
    Description: Public URL for the GraphQL API
    Value: !GetAtt ApiStack.Outputs.ApiEndpoint

  CognitoUserPoolId:
    Description: Cognito User Pool ID
    Value: !GetAtt AuthStack.Outputs.UserPoolId

  CognitoAppClientId:
    Description: Cognito App Client ID
    Value: !GetAtt AuthStack.Outputs.UserPoolClientId

  AuroraClusterEndpoint:
    Description: Aurora Cluster Endpoint
    Value: !GetAtt DatabaseStack.Outputs.AuroraClusterEndpoint

  AuroraInstanceEndpoint:
    Description: Aurora Instance Endpoint
    Value: !GetAtt DatabaseStack.Outputs.AuroraInstanceEndpoint

  ArtifactBucketName:
    Description: S3 bucket for SAM/CodePipeline artifacts
    Value: !Ref PipelineBucketName
    Export:
      Name: !Sub "${AWS::StackName}-ArtifactBucket"

  PipelineConsoleUrl:
    Description: Console URL to view the CodePipeline
    Value: !GetAtt PipelineStack.Outputs.PipelineConsoleUrl

  PipelineName:
    Description: Name of the CodePipeline
    Value: !GetAtt PipelineStack.Outputs.PipelineName
